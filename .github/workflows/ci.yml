name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_PUBLIC_NEON_AUTH_URL: https://ep-muddy-block-awgjb8ze.neonauth.c-12.us-east-1.aws.neon.tech/networking_tracker/auth
      NEXT_PUBLIC_NEON_DATA_API_URL: https://ep-muddy-block-awgjb8ze.apirest.c-12.us-east-1.aws.neon.tech/networking_tracker/rest/v1
      NEON_DATA_API_URL: https://ep-muddy-block-awgjb8ze.apirest.c-12.us-east-1.aws.neon.tech/networking_tracker/rest/v1
      CORS_ALLOWED_ORIGINS: https://web.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

